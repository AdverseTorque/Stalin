name: Ingest

on:
  schedule:
    # Every 20 minutes. GitHub's free scheduler isn't exact-to-the-minute
    # (can lag during peak load) — fine at this cadence. See PLAN.md §3.
    - cron: "*/20 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run ingestion
        run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          # Telegram — all optional; each adapter stays disabled until set.
          # Secrets, not committed config: this repo (and its Actions logs)
          # are public, and a channel list would reveal your subscriptions.
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
          TELEGRAM_PUBLIC_CHANNELS: ${{ secrets.TELEGRAM_PUBLIC_CHANNELS }}
