name: Ingest

on:
  schedule:
    # Every 20 minutes, at off-peak minutes. GitHub delays or drops scheduled
    # runs most at round marks (:00, :20, :40 ...), which left multi-hour
    # gaps in the feed; odd minutes are far less congested. It still isn't
    # exact-to-the-minute — for guaranteed cadence, trigger workflow_dispatch
    # from an external cron service. See PLAN.md §3.
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

# One ingest at a time — a late run overlapping the next would insert the
# same items twice and fight over the retention purge.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run ingestion
        run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          # Telegram — all optional; each adapter stays disabled until set.
          # Secrets, not committed config: this repo (and its Actions logs)
          # are public, and a channel list would reveal your subscriptions.
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
          TELEGRAM_PUBLIC_CHANNELS: ${{ secrets.TELEGRAM_PUBLIC_CHANNELS }}
